let uploads={};let activeWord=-1;let activeWords=new Set();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(items,value)=>items.map((x,i)=>`<option value="${esc(x)}" ${x===value?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(x)}</option>`).join('');function field(label,key,items,section='common'){const v=state[section][key];return `<div class="field"><label>${esc(label)}</label><select data-section="${section}" data-key="${key}">${opts(items,v)}</select></div>`}function input(label,key,section='common',type='text'){return `<div class="field"><label>${esc(label)}</label><input type="${type}" value="${esc(state[section][key])}" data-section="${section}" data-key="${key}"></div>`}function area(label,key,section='common'){return `<div class="field"><label>${esc(label)}</label><textarea data-section="${section}" data-key="${key}">${esc(state[section][key])}</textarea></div>`}function check(label,key){return `<div class="check"><input type="checkbox" id="c_${key}" data-section="common" data-key="${key}" ${state.common[key]?'checked':''}><label for="c_${key}">${esc(label)}</label></div>`}function panel(title,html){return `<section class="panel"><h2>${title}</h2>${html}</section>`}function save(){try{localStorage.setItem('stravaV25',JSON.stringify(state));$('saveStatus').textContent='Lokal gespeichert'}catch{$('saveStatus').textContent='Speichern nicht möglich'}}function tabs(){return state.world==='sign'?['Smart Director','Schnellwahl','Szenen','Hauptfigur','Nebenfiguren','Plakat & Text','Auto-Wand','Kamera & Ort','Referenzen','Prompt','Projekt','Erweitert']:['Schnellwahl','Szenen','Hauptfigur','Nebenfiguren','Wand / Plakat','Auto-Wand','Kamera & Ort','Referenzen','Prompt','Projekt','Erweitert']}function render(){document.querySelectorAll('.world').forEach(b=>b.classList.toggle('active',b.dataset.world===state.world));$('tabs').innerHTML=tabs().map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');let h='';switch(state.tab){case 'Smart Director':h=`<div class="notice"><b>Smart Director · 120 Szenenvorschläge</b><p>Die vollständige Auswahl wird über das BLACK-SIGN-Modul geladen. Falls sie hier nicht erscheint, wurde dieses Modul nicht ausgeführt.</p><div id="directorDiagnostics">Modulstatus: nicht geladen</div></div>`;break;case 'Schnellwahl':h=newQuickView();break;case 'Szenen':h=scenesView();break;case 'Hauptfigur':h=mainDirector();break;case 'Nebenfiguren':h=sideDirector();break;case 'Figuren':h=charactersView();break;case 'Posen':h=posesView();break;case 'Outfit':h=outfitView();break;case 'Erweitert':h=advancedView();break;case 'Wand / Plakat':h=wallSignView();break;case 'Plakat & Text':h=wallSignView();break;case 'Auto-Wand':h=autoWallView();break;case 'Kamera & Ort':h=cameraView();break;case 'Referenzen':h=referencesView();break;case 'Prompt':h=promptView();break;case 'Projekt':h=projectView();break;}$('view').innerHTML=h;bind();}

ange GPS-Route und STRAVA-Logo unten.</p><p><b>B:</b> Zwei Screenshots (BPM/Six Metrics + CLASSIC). Orange STRAVA-Logo oben, 2×3-Metrikraster, orange GPS-Route darunter auf 70 % der früheren Größe.</p><p class="hint">Exakte Screenshot-Zahlen, Einheiten, GPS-Form und Typografie vorgeben. KI-Generierung allein kann keine pixelgenaue Reproduktion garantieren; für perfekte Präzision ist ein Grafik-Overlay nötig.</p>`)}</div>`;return `<div class="notice">BLACK SIGN bleibt vollständig eigenständig: echtes XXL-Plakat bis zum Boden, keine STRAVA-Wand und keine schwebende Statistik.</div><div class="grid">${panel('Plakat',field('Plakattyp','signType',['Freistehendes XXL-Plakat bis Boden','Am umgedrehten Holzstuhl befestigt bis Boden'],'sign')+field('Plakatseite','signPosition',['Rechts','Links','Zentral, Gesicht frei'],'sign')+area('Deutscher Plakattext','signText','sign')+area('Plakat-Details','signNote','sign'))}${panel('Wortfarben-Editor',`<p class="hint">Mehrere Wörter nacheinander antippen (orange markiert), danach eine Farbe für alle ausgewählten Wörter wählen. Erneut antippen zum Abwählen.</p><div id="words">${wordHtml()}</div><div style="margin:16px 0 12px"><strong>LIVE-PLAKATVORSCHAU</strong><div id="legacySignPreview" style="margin:10px auto;background:#050505;border:7px solid #353535;max-width:330px;min-height:390px;box-sizing:border-box;padding:20px 14px;display:flex;align-items:center;justify-content:center;text-align:center"><div style="color:white;font-family:Impact,Arial,sans-serif;font-weight:900;font-size:clamp(13px,3vw,24px);line-height:1.18;overflow-wrap:anywhere;white-space:pre-wrap;width:100%">${state.sign.signText.split(/(\s+)/).map((w,i)=>/^\s+$/.test(w)?esc(w):`<span style="color:${esc(state.sign.wordColors[i]||'#ffffff')}">${esc(w)}</span>`).join('')}</div></div><p class="hint">Live-Vorschau: Farben und Zeilenumbrüche werden nach der Farbauswahl aktualisiert.</p></div><div class="field"><label>Farbe für markiertes Wort</label><input type="color" id= function buildPrompt(){const c=state.common,w=state.wall,s=state.sign,scene=sceneData[w.scene]||sceneData[0];let lines=[`STRAVA RUN GENERATOR V2.5.8 — FULL RESTORED — PREMIUM STABLE — ${state.world==='wall'?'STRAVA WALL':'BLACK SIGN / PLAKAT'}`,`OUTPUT: EXACTLY ONE ${c.format} professional, ultra-photorealistic outdoor full-body photograph. Real-life documentary photography, never CGI, 3D, illustration, cartoon, render, synthetic skin, artificial environments.`,``, `01 — ABSOLUTE REFERENCE HIERARCHY`,`PERSON PHOTO: ${c.identityLock?'LOCKED — preserve exact facial identity, eyes, eyebrows, nose, lips, jaw, beard, pores, asymmetry, age, head size and natural anatomy. No beautification, no face redesign.':'Use provided person reference for identity.'}`,`SHOE PHOTO: ${c.shoeLock?'MANDATORY SEPARATE LOCK — exact model, colors, upper, branding, outsole, laces, proportions. Do not use shoes from person photo.':'Use shoe reference.'}`,`LOCATION PHOTO: ${c.backgroundLock?'ABSOLUTE ORIGINAL BACKGROUND LOCK. Preserve original streets, buildings, trees, vehicles, signs, ground, horizon, perspective, ambient light and depth to the maximum possible extent. Keep most of the original background clearly visible. Do not replace, regenerate, beautify, move, reshape, or invent environmental elements. Modify ONLY expressly approved additions.':'Match location photo.'}`,`If any chosen pose or prop does not fit the existing environment, adapt the pose/placement or omit the incompatible prop. NEVER reconstruct the location to accommodate it.`,``, `02 — OUTFIT DIRECTOR`,`Brand: ${c.brand}. Club: ${c.club}. Collection: ${c.collection}. Top: ${c.top}, color ${c.topColor}. Sleeve details: ${c.topDetails}. Pants: ${c.pants}, color ${c.pantsColor}. Cap: ${c.cap}. Socks: ${c.socks}. Watch: ${c.watch}. Additional outfit: ${c.customOutfit||'None'}.`,`CRITICAL BRAND ACCURACY: No invented sleeve stripes, shoulder stripes, logos, patterns or brand-specific features. Stripes only if explicitly selected and genuinely appropriate to the referenced garment. No tights, leggings, compression pants or shorts-over-tights. Long pants are regular-fit training/jogging pants only.`,``, `03 — SCENE & INDEPENDENT CHARACTER DIRECTORS`,`Scene preset: ${scene[0]} — ${scene[1]}. Variant: ${w.variant}. Scene preset is a starting suggestion, not a pose lock.`,`MAIN RUNNER: ${state.world==='wall'?w.runnerPose:s.runnerPose}. Additional: ${c.runnerCustom||'None'}. Expression: ${c.expression}. Gaze: ${c.gaze}.`,`Every character's pose, gesture, expression, gaze and position are independent. Natural spontaneous interactions; no synchronized identical gestures, no pointing index fingers. Use open-hand gestures. Keep hands, forearms, fingers and feet anatomically correct and separate. No character caricatures. Alevi identity must not be inferred from facial features or stereotyped; portray respectfully without invented religious symbols.`,``, `04 — CAMERA / COMPOSITION`,`Format ${c.format}; [KA-01] FIXED LENS: ${c.cameraLens} mm full-frame equivalent. [KA-02] FIXED CAMERA-TO-SUBJECT DISTANCE: ${c.personDistance} meters. [BF-01] FORMAT: ${c.format}. AUTOMATIC FRAMING: derive subject scale, field of view, framing, background visibility and natural perspective from these two fixed optical inputs. NO virtual camera move closer, NO portrait crop or telephoto simulation. If the source LOCATION PHOTO has incompatible camera geometry, explicitly report a perspective conflict rather than silently overriding the chosen values. ${c.weather}. Location notes: ${c.locationNote||'None'}. Keep the original photo's physical perspective when using an absolute background lock; if inconsistent with fixed lens/distance, mark the conflict clearly rather than asserting both were achieved. Show full bodies, both shoes and natural contact shadows. Avoid covering key scenery.`];if(state.world==='wall'){lines.push(``,`05 — STRAVA WALL ONLY — ABSOLUTE WORLD LOCK`,`Create ONLY a plausible added matte-black brick wall, placed ${w.side.toLowerCase()}, with a frontal or mildly oblique face (${w.angle}); FACADE PROPORTION [FA-01]: ${w.facade||'Mittelhoch (empfohlen)'}. Offer moderately taller but not skyscraper-scale facades; NEVER a sharply slanted wall, extreme vanishing-point distortion, floating panels, physical placards or sign boards. HARD COMPOSITION PRIORITY: preserve the original location and keep the wall approximately ${w.width}% of image WIDTH, not 30% of total picture area. Never enlarge the wall merely to fit metrics. Scale the whole metric design down together instead. Leave most original location visible. Wall must look physically photographed and naturally lit.`,`STRAVA WALL VERSION ${w.version}. ${w.version==='A'?'Use ONE uploaded CLASSIC STRAVA screenshot. Reproduce Distance, Pace, Time vertically, GPS route ALWAYS STRAVA ORANGE #FC4C02 and STRAVA logo ALWAYS STRAVA ORANGE #FC4C02 at the BOTTOM (Version A exception to top-left alignment).':'Use TWO uploaded STRAVA screenshots: BPM/SIX METRICS and CLASSIC. STRAVA LOGO ALWAYS STRAVA ORANGE #FC4C02 and placed at the TOP, its LEFT EDGE EXACTLY ALIGNED to the LEFT EDGE of the FIRST DISTANCE COLUMN of the 2x3 metric grid (in the original wall plane before perspective projection). 2x3 metric grid: Distance | Pace | Time / Elev Gain | Cal | Avg HR. GPS route ALWAYS STRAVA ORANGE #FC4C02 underneath at 70% of previous Version B route size (30% smaller). Do not apply route scaling to Version A.'}`,`Reproduce screenshot values, units, punctuation, typographic hierarchy and GPS route geometry faithfully. Do not invent numbers or routes. All graphics must look painted on the physical wall, not like floating overlays. For pixel-accurate values and GPS geometry, use the app's Auto-Wand projection after the scene image has been created. ${w.statsPosition}. Extra: ${w.wallNote||'None'}.`,`07 — AUTO COMPOSITION & PERSPECTIVE LOCK (MANDATORY)`, `RUNNER CLEARANCE: ${w.runnerClearance}. DATA SAFE AREA: ${w.statsSafeArea}. Place the runner at the outer wall edge or slightly into the foreground, away from the metric panel and orange route. The runner must not consume the usable wall area. Preserve the selected runner pose but change his position and, if needed, physically plausible scale to clear the entire data region. Do not hide the original location to make space. Keep the elderly character and any other subjects in natural positions.`, `ONE PHYSICAL WALL PLANE: ${w.projection}. First determine the actual four corners and vanishing lines of the visible black-brick wall. Do not redraw the GPS trace from memory: prefer a separate precise image compositing pass using the screenshot itself. Map the ENTIRE original STRAVA graphic (logo, all labels, numeric values, and the GPS trace) onto that SAME physical wall plane using one consistent projective transform / homography. The WHOLE statistic, not just the route, must follow the actual wall slant. All labels and values remain white and accurately transcribed. The STRAVA logo and GPS route are ALWAYS orange #FC4C02. For Version B, logo and left edge of Distance metric are precisely aligned in the unwarped wall plane. For Version A, keep the logo at bottom. Align text baselines and route coordinates with brick courses and mortar perspective. NO independent flat 2D sticker, pasted-on route, mismatched rotation, inconsistent skew or floating UI. Preserve the GPS trace shape and metric content exactly in source-plane coordinates; perspective distortion is allowed ONLY as a single coherent wall projection. All painted elements inherit wall grain, mortar seams, ambient light and realistic occlusion.`, `If the graphic cannot fit without obscuring the runner or route, shift the runner away from the graphics or uniformly reduce the entire graphic; NEVER relocate or enlarge the wall at the expense of the original background. The wall should be near frontal where compatible with the source photo.`, `Do not let any person, prop or shadow cover essential metrics or GPS route.`)}else{const colored=Object.entries(s.wordColors).map(([i,col])=>{const word=s.signText.split(/(\s+)/)[Number(i)]||'';return word.trim()?`${word}=${col}`:null}).filter(Boolean).join(', ');lines.push(``,`05 — BLACK SIGN / PLAKAT ONLY — ABSOLUTE WORLD LOCK`,`Physical sign: ${s.signType}; position ${s.signPosition}. Exactly one realistic black physical sign reaching the ground; when a reversed wooden chair is selected, show the REAL REVERSED CHAIR with seat, legs and backrest physically supporting the sign, never substitute a freestanding A-frame sign; face unobstructed; no STRAVA WALL, no stats wall, no floating panel.`, `GERMAN SIGN TEXT — preserve exact line breaks, spelling, punctuation:`,s.signText,`Selected word colors: ${colored||'All text white unless otherwise specified'}. Additional sign details: ${s.signNote||'None'}.`,`Keep letters straight, readable, crisp and physically printed on the sign.`)}lines.push(``,`06 — FINAL NON-NEGOTIABLE QUALITY CHECK`,`Photorealistic real-life image only. No CGI, no 3D, no artificial texture. Original LOCATION PHOTO remains largely recognizable and visible. Correct face identity, exact separately referenced shoes, accurate outfit without invented stripes, correct hands and anatomy, natural lighting, contact shadows and physical interactions. No flags or religious buildings/symbols. Generic signs and non-identifying license plates. No invented objects unless explicitly requested and spatially feasible. Preserve each selected world independently.`,``,`ATTACHMENT CHECK: Attach PERSON PHOTO + SHOE PHOTO + LOCATION PHOTO separately. ${state.world==='wall'?(w.version==='A'?'Attach CLASSIC STRAVA screenshot.':'Attach BOTH BPM/SIX METRICS and CLASSIC STRAVA screenshots.'):'Attach any optional sign reference.'} Attach optional OUTFIT and CHARACTER photos only if intended. Images selected in this web app are previews only and are NOT embedded in this text prompt.`);if(state.world==='wall'){lines.push('',`V2.5.8 — HARD STRAVA WALL LAYOUT RULES: Project the ENTIRE statistics artwork (all metric labels, exact values, units, STRAVA logo and original GPS trace) as ONE coherent perspective-accurate graphic on the actual wall plane. Every element shares the identical wall vanishing points; never use a flat front-facing overlay on an angled wall. Do not invent, redraw or simplify the screenshot's GPS path. The GPS route is always STRAVA ORANGE (#FC4C02). The STRAVA logo is ALWAYS STRAVA ORANGE (#FC4C02), even when the source screenshot has a different color. Other metric text remains white and faithful to the source.`,w.version==='B'?'VERSION B: Place the orange STRAVA logo at the TOP, precisely LEFT-ALIGNED to the left edge of the first statistics column (DISTANCE). All 6 metrics, logo and route use one perspective projection.':'VERSION A: Keep the orange STRAVA logo at the BOTTOM, in the existing classic layout; do not force Version B top alignment.',`Preserve original background. Keep wall around ${w.width}% of image width; NEVER expand wall just to accommodate statistics. Uniformly scale the statistics layout down to fit, and move runner away from text without changing selected pose. No runner, elder or props may occlude any part of the logo, metrics or GPS route.`)}return lines.join('\\n')}

function directorPrompt(){let d=state.director,c=state.common;let lines=['','V2.5.8 — CODED ACTIVE SETTINGS / EXACT APP-TO-PROMPT MATCH'];codeSummary().forEach(([a,b])=>lines.push(`[${a}] ${b}`));lines.push('MAIN RUNNER FREE DIRECTION: [HF-FREI-01] '+(d.mainFreePose||'none')+'; [HF-FREI-02] '+(d.mainFreeAction||'none')+'; [HF-FREI-03] '+(d.mainFreeReaction||'none')+'. MODE '+d.mainFreeMode+'. Explicit custom directions override conflicting presets in Replace mode.');lines.push('INDEPENDENT SUPPORTING CAST — ONLY ENABLED CHARACTERS BELOW MAY APPEAR. No automatic cast added from the scene preset or legacy panels.');d.sides.forEach((f,i)=>{if(!f.enabled)return;lines.push(`[${sideId(f,i)}] INCLUDE FICTIONAL CHARACTER: ${f.type}. Clothing: ${f.style}. [${(SIDE_POSES.includes(f.pose)?code('PO',SIDE_POSES.indexOf(f.pose)):'PO-FREI')}] Pose: ${f.pose}. [${(CODE_REACTIONS.some(x=>x[1]===f.reaction)?code('RE',CODE_REACTIONS.findIndex(x=>x[1]===f.reaction)):'RE-FREI')}] Reaction: ${f.reaction}; expression and gesture: ${CODE_REACTIONS.find(x=>x[1]===f.reaction)?.[2]||'natural'}. [${code('BL',GAZE_TARGETS.indexOf(f.target))}] EXACT GAZE TARGET: ${f.target}. Gesture: ${f.gesture}. Prop: ${f.prop}. Free pose: ${f.freePose||'none'}. Free action: ${f.freeAction||'none'}. Free reaction: ${f.freeReaction||'none'}. Custom mode: ${f.freeMode}.`)});lines.push('ABSOLUTE GAZE PRIORITY: Each supporting character must direct BOTH pupils and eye axes precisely to the specified real target, with anatomically coherent head turn, neck rotation, chin tilt, and torso orientation. Runner target means eye contact with the RUNNER FACE; wall target means reading the VISIBLE METRICS/GPS, sign target means the printed LETTERS, other character target means their FACE, camera means direct lens contact. Never glance past the target, into empty space or randomly away. If pose conflicts, adapt neck and torso naturally without changing the intended action. No pointing index finger.');lines.push('CAMERA LOCK:
