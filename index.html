; override the color dropdown, preserve realistic fabric shading.':'Use selected top color '+c.topColor+'.'} COROS Streckenlinie – leuchtendes Neongelbgrün means the intensely fluorescent yellow-lime color of the running route in the supplied COROS map screenshot (visual approximation #DFFF00), apply this color to the runner top when selected. COROS Neon Yellow (Neongelb) is vivid fluorescent yellow with slight green tint; COROS Lime Green (Gelbgrün) is bright yellow-green; COROS Neon Green (Neongrün) is vivid fluorescent green. These are visual color descriptions, not official COROS HEX specifications.`,
 `CRITICAL BRAND ACCURACY: No invented sleeve stripes, shoulder stripes, logos, patterns or brand-specific features. Stripes only if explicitly selected and genuinely appropriate to the referenced garment. No tights, leggings, compression pants or shorts-over-tights. Long pants are regular-fit training/jogging pants only.`,``, `03 — SCENE & INDEPENDENT CHARACTER DIRECTORS`,`Scene preset: ${scene[0]} — ${scene[1]}. Variant: ${w.variant}. Scene preset is a starting suggestion, not a pose lock.`,`MAIN RUNNER: ${state.world==='wall'?w.runnerPose:s.runnerPose}. Additional: ${c.runnerCustom||'None'}. Expression: ${c.expression}. Gaze: ${c.gaze}.`,`Every character's pose, gesture, expression, gaze and position are independent. Natural spontaneous interactions; no synchronized identical gestures, no pointing index fingers. Use open-hand gestures. Keep hands, forearms, fingers and feet anatomically correct and separate. No character caricatures. Alevi identity must not be inferred from facial features or stereotyped; portray respectfully without invented religious symbols.`,``, `04 — CAMERA / COMPOSITION`,`Format ${c.format}; [KA-01] FIXED LENS: ${c.cameraLens} mm full-frame equivalent. [KA-02] FIXED CAMERA-TO-SUBJECT DISTANCE: ${c.personDistance} meters. [BF-01] FORMAT: ${c.format}. AUTOMATIC FRAMING: derive subject scale, field of view, framing, background visibility and natural perspective from these two fixed optical inputs. NO virtual camera move closer, NO portrait crop or telephoto simulation. If the source LOCATION PHOTO has incompatible camera geometry, explicitly report a perspective conflict rather than silently overriding the chosen values. ${c.weather}. Location notes: ${c.locationNote||'None'}. Keep the original photo's physical perspective when using an absolute background lock; if inconsistent with fixed lens/distance, mark the conflict clearly rather than asserting both were achieved. Show full bodies, both shoes and natural contact shadows. Avoid covering key scenery.`];if(state.world==='wall'){lines.push(``,`05 — STRAVA WALL ONLY — ABSOLUTE WORLD LOCK`,`Create ONLY a plausible added matte-black brick wall, placed ${w.side.toLowerCase()}, with a frontal or mildly oblique face (${w.angle}); FACADE PROPORTION [FA-01]: ${w.facade||'Mittelhoch (empfohlen)'}. Offer moderately taller but not skyscraper-scale facades; NEVER a sharply slanted wall, extreme vanishing-point distortion, floating panels, physical placards or sign boards. HARD COMPOSITION PRIORITY: preserve the original location and keep the wall approximately ${w.width}% of image WIDTH, not 30% of total picture area. Never enlarge the wall merely to fit metrics. Scale the whole metric design down together instead. Leave most original location visible. Wall must look physically photographed and naturally lit.`,`STRAVA WALL VERSION ${w.version}. ${w.version==='A'?'Use ONE uploaded CLASSIC STRAVA screenshot. Reproduce Distance, Pace, Time vertically, GPS route ALWAYS STRAVA ORANGE #FC4C02 and STRAVA logo ALWAYS STRAVA ORANGE #FC4C02 at the BOTTOM (Version A exception to top-left alignment).':'Use TWO uploaded STRAVA screenshots: BPM/SIX METRICS and CLASSIC. STRAVA LOGO ALWAYS STRAVA ORANGE #FC4C02 and placed at the TOP, its LEFT EDGE EXACTLY ALIGNED to the LEFT EDGE of the FIRST DISTANCE COLUMN of the 2x3 metric grid (in the original wall plane before perspective projection). 2x3 metric grid: Distance | Pace | Time / Elev Gain | Cal | Avg HR. GPS route ALWAYS STRAVA ORANGE #FC4C02 underneath at 70% of previous Version B route size (30% smaller). Do not apply route scaling to Version A.'}`,`Reproduce screenshot values, units, punctuation, typographic hierarchy and GPS route geometry faithfully. Do not invent numbers or routes. All graphics must look painted on the physical wall, not like floating overlays. For pixel-accurate values and GPS geometry, use the app's Auto-Wand projection after the scene image has been created. ${w.statsPosition}. Extra: ${w.wallNote||'None'}.`,`07 — AUTO COMPOSITION & PERSPECTIVE LOCK (MANDATORY)`, `RUNNER CLEARANCE: ${w.runnerClearance}. DATA SAFE AREA: ${w.statsSafeArea}. Place the runner at the outer wall edge or slightly into the foreground, away from the metric panel and orange route. The runner must not consume the usable wall area. Preserve the selected runner pose but change his position and, if needed, physically plausible scale to clear the entire data region. Do not hide the original location to make space. Keep the elderly character and any other subjects in natural positions.`, `ONE PHYSICAL WALL PLANE: ${w.projection}. First determine the actual four corners and vanishing lines of the visible black-brick wall. Do not redraw the GPS trace from memory: prefer a separate precise image compositing pass using the screenshot itself. Map the ENTIRE original STRAVA graphic (logo, all labels, numeric values, and the GPS trace) onto that SAME physical wall plane using one consistent projective transform / homography. The WHOLE statistic, not just the route, must follow the actual wall slant. All labels and values remain white and accurately transcribed. The STRAVA logo and GPS route are ALWAYS orange #FC4C02. For Version B, logo and left edge of Distance metric are precisely aligned in the unwarped wall plane. For Version A, keep the logo at bottom. Align text baselines and route coordinates with brick courses and mortar perspective. NO independent flat 2D sticker, pasted-on route, mismatched rotation, inconsistent skew or floating UI. Preserve the GPS trace shape and metric content exactly in source-plane coordinates; perspective distortion is allowed ONLY as a single coherent wall projection. All painted elements inherit wall grain, mortar seams, ambient light and realistic occlusion.`, `If the graphic cannot fit without obscuring the runner or route, shift the runner away from the graphics or uniformly reduce the entire graphic; NEVER relocate or enlarge the wall at the expense of the original background. The wall should be near frontal where compatible with the source photo.`, `Do not let any person, prop or shadow cover essential metrics or GPS route.`)}else{const colored=Object.entries(s.wordColors).map(([i,col])=>{const word=s.signText.split(/(\s+)/)[Number(i)]||'';return word.trim()?`${word}=${col}`:null}).filter(Boolean).join(', ');lines.push(``,`05 — BLACK SIGN / PLAKAT ONLY — ABSOLUTE WORLD LOCK`,`Physical sign: ${s.signType}; position ${s.signPosition}. Exactly one realistic black sign using the physical installation specified in Plakat & Text. If mounted on a building, hang it securely and prominently on that building, facing viewers; DO NOT add a freestanding sign or ground stand. If a reversed wooden chair is selected, use a real reversed chair with physical contact. Keep face unobstructed; no STRAVA WALL, no stats wall, no floating panel.`, `GERMAN SIGN TEXT — preserve exact line breaks, spelling, punctuation:`,s.signText,`Selected word colors: ${colored||'All text white unless otherwise specified'}. Additional sign details: ${s.signNote||'None'}.`,`Keep letters straight, readable, crisp and physically printed on the sign.`)}lines.push(``,`06 — FINAL NON-NEGOTIABLE QUALITY CHECK`,`Photorealistic real-life image only. No CGI, no 3D, no artificial texture. Original LOCATION PHOTO remains largely recognizable and visible. Correct face identity, exact separately referenced shoes, accurate outfit without invented stripes, correct hands and anatomy, natural lighting, contact shadows and physical interactions. No flags or religious buildings/symbols. Generic signs and non-identifying license plates. No invented objects unless explicitly requested and spatially feasible. Preserve each selected world independently.`,``,`ATTACHMENT CHECK: Attach PERSON PHOTO + SHOE PHOTO + LOCATION PHOTO separately. ${state.world==='wall'?(w.version==='A'?'Attach CLASSIC STRAVA screenshot.':'Attach BOTH BPM/SIX METRICS and CLASSIC STRAVA screenshots.'):'Attach any optional sign reference.'} Attach optional OUTFIT and CHARACTER photos only if intended. Images selected in this web app are previews only and are NOT embedded in this text prompt.`);if(state.world==='wall'){lines.push('',`V2.5.8 — HARD STRAVA WALL LAYOUT RULES: Project the ENTIRE statistics artwork (all metric labels, exact values, units, STRAVA logo and original GPS trace) as ONE coherent perspective-accurate graphic on the actual wall plane. Every element shares the identical wall vanishing points; never use a flat front-facing overlay on an angled wall. Do not invent, redraw or simplify the screenshot's GPS path. The GPS route is always STRAVA ORANGE (#FC4C02). The STRAVA logo is ALWAYS STRAVA ORANGE (#FC4C02), even when the source screenshot has a different color. Other metric text remains white and faithful to the source.`,w.version==='B'?'VERSION B: Place the orange STRAVA logo at the TOP, precisely LEFT-ALIGNED to the left edge of the first statistics column (DISTANCE). All 6 metrics, logo and route use one perspective projection.':'VERSION A: Keep the orange STRAVA logo at the BOTTOM, in the existing classic layout; do not force Version B top alignment.',`Preserve original background. Keep wall around ${w.width}% of image width; NEVER expand wall just to accommodate statistics. Uniformly scale the statistics layout down to fit, and move runner away from text without changing selected pose. No runner, elder or props may occlude any part of the logo, metrics or GPS route.`)}return lines.join('\\n')}
