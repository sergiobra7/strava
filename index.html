function syncPosterPreviewColors321(){
 const smart=document.getElementById('psPreviewHost355');
 if(smart&&state.world==='sign'){
  const nodes=[...smart.querySelectorAll('[data-ps-word]')];
  if(nodes.length){
   const tokens=String(state.sign.signText||'').split(/(\s+)/);
   const count=tokens.filter(x=>x&&!/^\s+$/.test(x)).length;
   if(count!==nodes.length)throw Error('Smart-Director-Vorschau: Wortanzahl stimmt nicht.');
   const map={};
   for(const node of nodes){
    const index=Number(node.dataset.psWord),word=tokens[index];
    if(!Number.isInteger(index)||!word||word!==node.textContent.trim())throw Error('Smart-Director-Vorschau: Wortposition stimmt nicht.');

    const rgb=css.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
    const hex=/^#[0-9a-f]{6}$/i.test(css)?css.toUpperCase():rgb?'#'+[rgb[1],rgb[2],rgb[3]].map(n=>Number(n).toString(16).padStart(2,'0')).join('').toUpperCase():null;
    if(!hex)throw Error('Smart-Director-Vorschau: Farbwert ungültig '+css);
    map[index]=hex;
   }
   state.sign.wordColors=map;save();return;
  }
 }

 if(layout.lines.reduce((n,row)=>n+row.words.length,0)!==expected||hitTargets.length!==expected)throw Error('Plakat-Wortzuordnung nicht synchron.');

function presetsTab398(){return `<details class="panel"><summary><b>Meine Bilder · Galerie und Einstellungen</b></summary>${archiveView413()}</details><div class="notice"><b>⭐ MEINE PRESETS · BILDERGALERIE</b><p>Wähle, ob die Einstellungen tatsächlich aus dem Generator stammen oder anhand eines Referenzbildes rekonstruiert werden. Bilder und Presets bleiben lokal auf diesem Gerät.</p></div><section class="panel"><h2>Neues Preset</h2><div class="field"><label>Preset-Typ</label><select id="p399type"><option value="captured">✅ Aktuelle Generator-Settings speichern</option><option value="estimated">🔍 Referenzbild · Settings rekonstruieren</option></select></div><div class="field"><label>Preset-Name</label><input id="p399name" type="text" placeholder="z. B. 001 · Bäckerei · Treppen-Chill"></div><div class="field"><label>Originalbild</label><input id="p399file" type="file" accept="image/*"></div><div id="p399estimated" hidden><p class="hint">Diese Werte sind eine manuelle Schätzung und keine aus dem Bild ausgelesenen Kamera-Metadaten. Du kannst sie vor dem Speichern anpassen.</p><label>Szene / Ort<input id="p399scene" type="text" value="Bäckerei mit Außentreppe"></label><label>Hauptfigur / Pose<input id="p399pose" type="text" value="Auf Steintreppe entspannt sitzend, Beine locker"></label><label>Opa / Position<input id="p399opa" type="text" value="Links sitzend, gestikuliert"></label><label>Tante / Position<input id="p399teyze" type="text" value="Rechts sitzend, lacht"></label><label>Plakat / Position<input id="p399poster" type="text" value="Schwarzes Plakat rechts"></label><label>Brennweite (mm) · geschätzt<input id="p399lens" type="number" min="16" max="35" value="24"></label><label>Abstand (m) · geschätzt<input id="p399distance" type="number" min="1" value="5"></label><label>Bildformat<select id="p399format"><option>9:16</option><option>4:5</option></select></label><label>Weitere Hinweise<textarea id="p399notes" rows="3">Bäckerei-Treppe, natürliche dokumentarische Fotografie; Blick zur Kamera.</textarea></label></div><button class="btn" id="p399save" type="button">＋ Preset mit Bild speichern</button><p class="hint" id="p399help">Die momentan aktiven Einstellungen werden unverändert gespeichert.</p></section><section class="panel"><h2>☁️ Backup · iCloud Drive</h2><p class="hint">Alle Bilder und Einstellungen in einer einzigen Backup-Datei sichern. Die Datei enthält sämtliche Presets und kann später wieder importiert werden.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="p406export" type="button">⬇️ Backup exportieren</button><label class="btn secondary" style="cursor:pointer">⬆️ Backup importieren<input id="p406import" type="file" accept=".json,application/json" style="display:none"></label></div><p id="p406status" class="hint" aria-live="polite">Vor dem Löschen von Safari-Websitedaten unbedingt exportieren und die Datei extern sichern.</p></section><section class="panel"><h2>Gespeicherte Presets</h2><div id="p399gallery">Lade Galerie …</div></section>`}
function presetSettingsView400(settings){const labels={world:'Welt',common:'Hauptfigur · Outfit · Kamera · Figuren',wall:'Wand',sign:'Plakat & Text'};const format=(v)=>typeof v==='object'?JSON.stringify(v):String(v);return Object.entries(settings||{}).filter(([k])=>k!=='tab').map(([section,values])=>{if(!values||typeof values!=='object')return '<p><b>'+presetEscape399(section)+'</b>: '+presetEscape399(format(values))+'</p>';return '<details style="margin:8px 0;padding:8px;border:1px solid #48515d;border-radius:8px"><summary><b>'+presetEscape399(labels[section]||section)+'</b> · '+Object.keys(values).length+' Werte</summary><div style="max-height:300px;overflow:auto">'+Object.entries(values).map(([key,val])=>'<div style="border-bottom:1px solid #343b48;padding:6px 0"><b>'+presetEscape399(key)+'</b><br><span style="overflow-wrap:anywhere">'+presetEscape399(format(val))+'</span></div>').join('')+'</div></details>'}).join('')}
async function presetGallery399(){const box=document.getElementById('p399gallery');if(!box)return;presetUrls399.forEach(URL.revokeObjectURL);presetUrls399=[];try{const rows=(await presetAll399()).sort((a,b)=>b.created-a.created);if(!rows.length){box.textContent='Noch keine Presets gespeichert.';return}box.innerHTML=rows.map(x=>{const url=URL.createObjectURL(x.image);presetUrls399.push(url);return `<div style="padding:12px;margin:12px 0;border:1px solid #48515d;border-radius:12px"><img src="${url}" alt="Preset-Vorschau" style="display:block;max-width:100%;width:180px;max-height:240px;object-fit:contain;border-radius:8px"><b>${presetEscape399(x.name)}</b><div class="tiny">${new Date(x.created).toLocaleString('de-DE')} · ${x.source==='estimated'?'Manuell geschätzt · nicht verifiziert':'Im Generator gespeichert'}</div><details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">⚙️ VERWENDETE SETTINGS ANZEIGEN</summary>${(x.source==='estimated'&&x.estimate?'<p><b>MANUELL GESCHÄTZT · bitte prüfen</b></p>'+Object.entries(x.estimate).map(([k,v])=>'<div><b>'+presetEscape399(k)+'</b>: '+presetEscape399(v)+'</div>').join(''):'' )+presetSettingsView400(x.settings)}</details><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:9px"><button class="btn" data-p399-load="${x.id}">Szene laden · Text behalten</button><button class="btn secondary" data-p399-all="${x.id}">Alles laden</button><button class="btn secondary" data-p399-update="${x.id}">Aktuelle Settings speichern</button><button class="btn secondary" data-p399-delete="${x.id}">Löschen</button><a class="btn secondary" href="${url}" download="${presetEscape399(x.image.name||'preset-bild')}">Originalbild</a></div></div>`}).join('');box.querySelectorAll('[data-p399-load],[data-p399-all],[data-p399-delete],[data-p399-update]').forEach(b=>b.onclick=async()=>{const id=b.dataset.p399Load||b.dataset.p399All||b.dataset.p399Delete||b.dataset.p399Update;if(b.dataset.p399Update){if(!confirm('Aktuelle Generator-Einstellungen für dieses Preset speichern? Das Originalbild bleibt erhalten.'))return;const item=await presetTxn399('readonly',s=>s.get(id));if(!item)return;item.settings=clone(state);item.signatureSnapshot=window.stravaSignature400?.get?.()||null;item.source='captured';await presetPut399(item);presetGallery399();return}if(b.dataset.p399Delete){if(!confirm('Preset und Originalbild wirklich löschen?'))return;await presetDel399(id);presetGallery399();return}const item=await presetTxn399('readonly',s=>s.get(id));if(!item)return;const keep=b.hasAttribute('data-p399-load');const current=clone(state);const restored=clone(item.settings);if(keep){if(current.sign&&restored.sign){for(const k of ['signText','signNote','wordColors'])if(k in current.sign)restored.sign[k]=clone(current.sign[k])}if(current.wall&&restored.wall){for(const k of Object.keys(current.wall))if(/text|schrift|caption|zeile/i.test(k))restored.wall[k]=clone(current.wall[k])}}const tab=state.tab;state=merge(clone(defaultState),restored);state.tab=tab;if(item.signatureSnapshot&&window.stravaSignature400?.restore)window.stravaSignature400.restore(item.signatureSnapshot);save();render();alert(keep?'Szene geladen. Aktueller Text bleibt erhalten.':'Preset vollständig geladen.')})}catch(e){box.textContent='Galerie konnte nicht geladen werden: '+e.message}}

async function presetFileToData406(file){return new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=()=>no(reader.error);reader.readAsDataURL(file)})}
function presetDataToFile406(data,name,type){const comma=data.indexOf(',');if(comma<0)throw Error('Bilddaten ungültig');const raw=atob(data.slice(comma+1));const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new File([bytes],name||'preset-image', {type:type||'image/jpeg'})}
function presetBackupBind406(){
 const exp=document.getElementById('p406export'),imp=document.getElementById('p406import'),status=document.getElementById('p406status');if(!exp||!imp)return;
 exp.onclick=async()=>{exp.disabled=true;status.textContent='Erstelle Sicherung …';try{
 const items=await presetAll399();if(!items.length){status.textContent='Noch keine Presets vorhanden.';return}
 const result=[];for(let i=0;i<items.length;i++){const item=items[i];result.push({...item,image:undefined,imageData:await presetFileToData406(item.image),imageName:item.image.name||'bild-'+(i+1)+'.jpg',imageType:item.image.type||'image/jpeg'});status.textContent='Sichere Bild '+(i+1)+' von '+items.length+' …'}
 const browserSettings={};for(const key of ['strava-signature-xxl-v400','strava-text-favorites-430','strava-premium-studio-350','stravaPoster321','strava-colors-persist-421']){const value=localStorage.getItem(key);if(value!==null)browserSettings[key]=value;}const backup={format:'strava-presets-backup',version:2,created:new Date().toISOString(),items:result,browserSettings};
 const name='STRAVA-PRESETS-BACKUP-'+new Date().toISOString().slice(0,10)+'.json';const file=new File([JSON.stringify(backup)],name,{type:'application/json'});
 if(navigator.share){try{await navigator.share({files:[file],title:name});status.textContent='Teilen abgeschlossen.';return}catch(e){status.textContent=e.name==='AbortError'?'Teilen abgebrochen.':'Teilen fehlgeschlagen: '+String(e.message||e);return}}
 status.textContent='Teilen wird von diesem Browser nicht unterstützt. Kein automatischer Download.';
 }catch(e){status.textContent='Export fehlgeschlagen: '+e.message}finally{exp.disabled=false}};
 imp.onchange=async()=>{const file=imp.files&&imp.files[0];if(!file)return;status.textContent='Prüfe Backup …';try{
 const data=JSON.parse(await file.text());if(data.format!=='strava-presets-backup'||![1,2].includes(data.version)||!Array.isArray(data.items))throw Error('Kein gültiges STRAVA-Preset-Backup');
 if(data.items.length>2000)throw Error('Ungewöhnlich viele Einträge');
 if(!confirm(data.items.length+' Presets aus dieser Datei importieren? Bestehende Presets bleiben erhalten; gleiche IDs werden ersetzt.')){status.textContent='Import abgebrochen.';return}
 let count=0;for(const item of data.items){if(!item||typeof item.id!=='string'||typeof item.imageData!=='string'||!item.settings||typeof item.settings!=='object')throw Error('Unvollständiger Preset-Eintrag');const image=presetDataToFile406(item.imageData,item.imageName,item.imageType);const {imageData,imageName,imageType,...saved}=item;await presetPut399({...saved,image});count++;status.textContent='Importiere '+count+' von '+data.items.length+' …'}
 if(data.version===2&&data.browserSettings&&typeof data.browserSettings==='object'){if(confirm('Zusätzlich im Backup gespeicherte Signature-Auswahl, Text-Favoriten und Editor-Einstellungen wiederherstellen? Dies ersetzt die derzeitigen Browser-Einstellungen in diesen Bereichen.')){const allowed=['strava-signature-xxl-v400','strava-text-favorites-430','strava-premium-studio-350','stravaPoster321','strava-colors-persist-421'];for(const key of allowed)if(typeof data.browserSettings[key]==='string')localStorage.setItem(key,data.browserSettings[key]);if(typeof data.browserSettings['strava-signature-xxl-v400']==='string'&&window.stravaSignature400?.restore){try{window.stravaSignature400.restore(JSON.parse(data.browserSettings['strava-signature-xxl-v400']))}catch(e){console.warn('Signature restore',e)}}}}await presetGallery399();status.textContent=count+' Presets erfolgreich importiert. Bestehende andere Presets wurden beibehalten.';
 }catch(e){status.textContent='Import fehlgeschlagen: '+e.message}finally{imp.value=''}};
}
function presetBind399(){const b=document.getElementById('p399save');if(!b)return;const type=document.getElementById('p399type'),extra=document.getElementById('p399estimated'),help=document.getElementById('p399help');presetBackupBind406();type.onchange=()=>{extra.hidden=type.value!=='estimated';help.textContent=type.value==='estimated'?'Schätzwerte werden separat gekennzeichnet. Die aktiven Generator-Einstellungen werden NICHT fälschlich als Originalwerte ausgegeben.':'Die momentan aktiven Generator-Einstellungen werden unverändert gespeichert.'};presetGallery399();b.onclick=async()=>{const name=document.getElementById('p399name').value.trim(),file=document.getElementById('p399file').files[0];if(!name||!file){alert('Bitte Namen und Bild auswählen.');return}b.disabled=true;try{const estimated=type.value==='estimated';const settings=clone(state);const signatureSnapshot=window.stravaSignature400?.get?.()||null;let estimate=null;if(estimated){const get=id=>document.getElementById(id).value.trim();estimate={scene:get('p399scene'),pose:get('p399pose'),opa:get('p399opa'),teyze:get('p399teyze'),poster:get('p399poster'),lens:get('p399lens'),distance:get('p399distance'),format:get('p399format'),notes:get('p399notes')};settings.world='sign';settings.common.format=estimate.format;settings.common.cameraLens=estimate.lens;settings.common.personDistance=estimate.distance;settings.common.locationNote=estimate.scene+'; '+estimate.notes;settings.common.runnerCustom=estimate.pose;settings.common.opaCustom=estimate.opa;settings.common.teyzeCustom=estimate.teyze;settings.common.opaVisible=true;settings.common.teyzeVisible=true;settings.sign.signPosition='Rechts';settings.sign.signNote=estimate.poster;}await presetPut399({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,created:Date.now(),image:file,settings,signatureSnapshot:estimated?null:signatureSnapshot,source:estimated?'estimated':'captured',estimate});document.getElementById('p399name').value='';document.getElementById('p399file').value='';await presetGallery399();alert(estimated?'Referenz-Preset mit geschätzten Einstellungen gespeichert.':'Bild und aktuelle Einstellungen gespeichert.')}catch(e){alert('Speichern fehlgeschlagen: '+e.message)}finally{b.disabled=false}}}
